  <script>
    // Tema pre učitavanja aplikacije, da ne trepne tamna pa svetla. Isto računa PodesavanjaService.
    (function () {
      var tema = 'dark';
      try {
        var izbor = localStorage.getItem('ai-jutro:tema');
        tema = izbor === 'svetla' || (izbor !== 'tamna' && matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
      } catch (e) {}
      document.documentElement.dataset.theme = tema;
    })();
    // Chrome (Android) javlja da sajt može da se instalira često pre nego što se aplikacija pokrene,
    // pa se događaj čuva ovde, a traku „Instaliraj“ prikazuje InstalirajBaner.
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window.__instalacija = e;
      window.dispatchEvent(new Event('instalacija-spremna'));
    });
  </script>
