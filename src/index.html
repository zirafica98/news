<!doctype html>
<html lang="sr-Latn">
<head>
  <meta charset="utf-8">
  <title>AI News</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#020617">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="AI News">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="alternate" type="application/rss+xml" title="AI News" href="/feed.xml">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="AI News">
  <meta property="og:title" content="AI News">
  <meta property="og:description" content="Jutarnji pregled AI vesti na srpskom: šta se desilo, šta je novo izašlo i kako da probaš, ideje za aplikacije i cene tokena.">
  <meta property="og:image" content="/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <script>
    // Tema pre učitavanja aplikacije, da ne trepne tamna pa svetla. Isto računa PodesavanjaService.
    (function () {
      var tema = 'dark';
      try {
        var izbor = localStorage.getItem('ai-jutro:tema');
        tema = izbor === 'svetla' || (izbor !== 'tamna' && matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
      } catch (e) {}
      document.documentElement.dataset.theme = tema;
    })();
  </script>
</head>
<body class="bg-slate-950 text-slate-100 antialiased">
  <app-root></app-root>
</body>
</html>
