<header class="sticky top-0 z-20 border-b border-slate-900 bg-slate-950/90 pt-[env(safe-area-inset-top)] backdrop-blur">
  <div class="mx-auto flex h-14 max-w-2xl items-center justify-between px-4">
    <a routerLink="/" class="flex items-center gap-2 font-semibold text-white">
      <span aria-hidden="true">☕</span> AI News
    </a>
    <div class="flex items-center gap-1 text-sm">
      <a routerLink="/arhiva" routerLinkActive="bg-slate-800 text-white" ariaCurrentWhenActive="page" class="rounded-full px-3 py-1.5 text-slate-400 hover:text-white">{{ t('nav.arhiva') }}</a>
      <a routerLink="/sacuvano" routerLinkActive="bg-slate-800 text-white" ariaCurrentWhenActive="page" class="rounded-full px-3 py-1.5 text-slate-400 hover:text-white">{{ t('nav.sacuvano') }}</a>
      <app-podesavanja-meni />
    </div>
  </div>
</header>

<main class="mx-auto max-w-2xl px-4 pb-[calc(6rem+env(safe-area-inset-bottom))]">
  <router-outlet />
</main>

<nav
  [attr.aria-label]="t('app.deloviIzdanja')"
  class="fixed inset-x-0 bottom-0 z-20 border-t border-slate-800 bg-slate-950/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"
>
  <ul class="mx-auto grid max-w-2xl grid-cols-4">
    @for (k of kartice(); track k.id) {
      <li>
        <a
          [routerLink]="k.link"
          [attr.aria-current]="aktivna() === k.id ? 'page' : null"
          class="flex flex-col items-center gap-1 pb-2 pt-2.5 text-[11px] font-medium transition-colors"
          [class.text-amber-400]="aktivna() === k.id"
          [class.text-slate-500]="aktivna() !== k.id"
        >
          <svg viewBox="0 0 24 24" class="size-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path [attr.d]="k.ikona" />
          </svg>
          {{ t(k.naziv) }}
        </a>
      </li>
    }
  </ul>
</nav>
