<header class="sticky top-0 z-20 border-b border-slate-900 bg-slate-950/90 pt-[env(safe-area-inset-top)] backdrop-blur">
  <div class="mx-auto flex h-14 max-w-2xl items-center justify-between px-4">
    <a routerLink="/" class="flex items-center gap-2 font-semibold text-white">
      <span aria-hidden="true">☕</span> AI Jutro
    </a>
    <nav aria-label="Glavna navigacija" class="flex gap-1 text-sm">
      @for (l of linkovi; track l.putanja) {
        <a
          [routerLink]="l.putanja"
          routerLinkActive="bg-slate-800 text-white"
          [routerLinkActiveOptions]="{ exact: l.tacno }"
          ariaCurrentWhenActive="page"
          class="rounded-full px-3 py-1.5 text-slate-400 hover:text-white"
          >{{ l.naziv }}</a
        >
      }
    </nav>
  </div>
</header>

<main class="mx-auto max-w-2xl px-4 pb-16">
  <router-outlet />
</main>
