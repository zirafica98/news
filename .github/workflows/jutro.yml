# AI News — jutarnje izdanje na GitHub-u, bez zavisnosti od Mac-a.
#
# Claude Code radi preko Claude pretplate: tajna CLAUDE_CODE_OAUTH_TOKEN se pravi komandom `claude setup-token`
# i čuva u Settings → Secrets and variables → Actions. Nema plaćanja po API pozivu.
#
# Glavni okidač je Vercel Cron (api/pokreni-izdanje.mjs, vercel.json), jer GitHub zakazane poslove
# za ovaj repo kasni satima ili ih ne pokrene (17.09. nijedan od 32 termina). Dva GitHub termina ispod
# su samo rezerva: posao radi ako je u Beogradu 05:00 ili kasnije i ako današnje izdanje još ne postoji.
# Izdanje je gotovo pre 7h, a notifikacija se šalje tačno u 07:00 (posao sačeka).

name: Jutarnje izdanje

on:
  schedule:
    - cron: '17 3 * * *'
    - cron: '47 4 * * *'
  workflow_dispatch:
    inputs:
      rezim:
        description: 'normalno = samo ako danas nema izdanja · ponovo = napravi današnje iznova · provera = test bez objavljivanja · notifikacija = samo pošalji push · instagram = samo objavi današnje izdanje na Instagram · instagram-token = produži Instagram token'
        type: choice
        options: [normalno, ponovo, provera, notifikacija, instagram, instagram-token]
        default: normalno
      datum:
        description: 'Samo za režim instagram: datum ili više datuma razdvojenih razmakom (2026-10-08 2026-10-09). Prazno = danas.'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: jutarnje-izdanje
  cancel-in-progress: false

jobs:
  izdanje:
    runs-on: ubuntu-latest
    # Pravljenje traje ~15 min, a posao zatim čeka 07:00 za notifikaciju.
    timeout-minutes: 240
    steps:
      - name: Da li je vreme za izdanje
        id: vreme
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sat=$(TZ=Europe/Belgrade date +%-H)
          datum=$(TZ=Europe/Belgrade date +%F)
          pokreni=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "$sat" -lt 5 ]; then
              echo "U Beogradu je $sat h, prerano."
              pokreni=false
            elif gh api "repos/${{ github.repository }}/contents/public/data/$datum.json" --silent 2>/dev/null; then
              echo "Izdanje za $datum već postoji."
              pokreni=false
            fi
          fi
          echo "pokreni=$pokreni" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.vreme.outputs.pokreni == 'true'
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        if: steps.vreme.outputs.pokreni == 'true'
        with:
          node-version: 22

      - name: Claude Code
        if: steps.vreme.outputs.pokreni == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Git identitet
        if: steps.vreme.outputs.pokreni == 'true'
        run: |
          git config user.name "Mihajlo"
          git config user.email "zirafica.98@gmail.com"

      - name: Izdanje
        if: steps.vreme.outputs.pokreni == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          REZIM: ${{ inputs.rezim || 'normalno' }}
          DATUMI: ${{ inputs.datum }}
        run: |
          case "$REZIM" in
            ponovo) bash scripts/jutro.sh --ponovo ;;
            provera) bash scripts/jutro.sh --provera ;;
            notifikacija) npm ci --prefix scripts --no-audit --no-fund --loglevel=error && node scripts/posalji-push.mjs ;;
            instagram)
              npm ci --prefix scripts --no-audit --no-fund --loglevel=error
              datumi="$DATUMI"
              [ -z "$datumi" ] && datumi="$(TZ=Europe/Belgrade date +%F)"
              prvi=true
              for d in $datumi; do
                # Razmak između objava, da Instagram ne vidi niz postova u istoj sekundi.
                $prvi || sleep 120
                prvi=false
                node scripts/objavi-instagram.mjs --datum="$d"
              done
              ;;
            instagram-token) ;;
            *) bash scripts/jutro.sh ;;
          esac

      # Instagram token važi 60 dana, pa se produžava 1. i 15. u mesecu (ili ručno, režim instagram-token).
      - name: Instagram token
        if: steps.vreme.outputs.pokreni == 'true' && !cancelled()
        continue-on-error: true
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
          REZIM: ${{ inputs.rezim || 'normalno' }}
        run: |
          dan=$(TZ=Europe/Belgrade date +%-d)
          if [ "$REZIM" = "instagram-token" ] || [ "$dan" = "1" ] || [ "$dan" = "15" ]; then
            node scripts/osvezi-instagram-token.mjs
          else
            echo "Token se produžava 1. i 15. u mesecu, danas je $dan."
          fi
