# AI News — jutarnje izdanje na GitHub-u, bez zavisnosti od Mac-a.
#
# Claude Code radi preko Claude pretplate: tajna CLAUDE_CODE_OAUTH_TOKEN se pravi komandom `claude setup-token`
# i čuva u Settings → Secrets and variables → Actions. Nema plaćanja po API pozivu.
#
# GitHub cron je u UTC, a Srbija menja sat. GitHub zakazane poslove ume i da zakasni ili preskoči
# (16.09. nijedan od termina 04:30/05:30 UTC nije pokrenut). Zato posao kreće na svakih 15 minuta
# od 04:07 do 11:52 UTC, a stvarno radi samo ako je u Beogradu 06:00 ili kasnije i ako današnje
# izdanje još ne postoji. Ostala pokretanja se završe za desetak sekundi.
# Minute nisu okrugle jer GitHub najviše kasni na punom satu i pola sata.

name: Jutarnje izdanje

on:
  schedule:
    - cron: '7,22,37,52 4-11 * * *'
  workflow_dispatch:
    inputs:
      rezim:
        description: 'normalno = samo ako danas nema izdanja · ponovo = napravi današnje iznova · provera = test bez objavljivanja'
        type: choice
        options: [normalno, ponovo, provera]
        default: normalno

permissions:
  contents: write

concurrency:
  group: jutarnje-izdanje
  cancel-in-progress: false

jobs:
  izdanje:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Da li je vreme za izdanje
        id: vreme
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sat=$(TZ=Europe/Belgrade date +%-H)
          datum=$(TZ=Europe/Belgrade date +%F)
          pokreni=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "$sat" -lt 6 ]; then
              echo "U Beogradu je $sat h, prerano."
              pokreni=false
            elif gh api "repos/${{ github.repository }}/contents/public/data/$datum.json" --silent 2>/dev/null; then
              echo "Izdanje za $datum već postoji."
              pokreni=false
            fi
          fi
          echo "pokreni=$pokreni" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.vreme.outputs.pokreni == 'true'
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        if: steps.vreme.outputs.pokreni == 'true'
        with:
          node-version: 22

      - name: Claude Code
        if: steps.vreme.outputs.pokreni == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Git identitet
        if: steps.vreme.outputs.pokreni == 'true'
        run: |
          git config user.name "Mihajlo"
          git config user.email "zirafica.98@gmail.com"

      - name: Izdanje
        if: steps.vreme.outputs.pokreni == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          REZIM: ${{ inputs.rezim || 'normalno' }}
        run: |
          case "$REZIM" in
            ponovo) bash scripts/jutro.sh --ponovo ;;
            provera) bash scripts/jutro.sh --provera ;;
            *) bash scripts/jutro.sh ;;
          esac
