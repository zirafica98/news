# AI News — jutarnje izdanje na GitHub-u, bez zavisnosti od Mac-a.
#
# Claude Code radi preko Claude pretplate: tajna CLAUDE_CODE_OAUTH_TOKEN se pravi komandom `claude setup-token`
# i čuva u Settings → Secrets and variables → Actions. Nema plaćanja po API pozivu.
#
# Glavni okidač je Vercel Cron (api/pokreni-izdanje.mjs, vercel.json), jer GitHub zakazane poslove
# za ovaj repo kasni satima ili ih ne pokrene (17.09. nijedan od 32 termina). Dva GitHub termina ispod
# su samo rezerva: posao radi ako je u Beogradu 05:00 ili kasnije i ako današnje izdanje još ne postoji.
# Izdanje je gotovo pre 7h, a notifikacija se šalje tačno u 07:00 (posao sačeka).

name: Jutarnje izdanje

on:
  schedule:
    - cron: '17 3 * * *'
    - cron: '47 4 * * *'
  workflow_dispatch:
    inputs:
      rezim:
        description: 'normalno = samo ako danas nema izdanja · ponovo = napravi današnje iznova · provera = test bez objavljivanja · notifikacija = samo pošalji push · drustvene = objavi na sve mreže (Instagram, Threads, YouTube, Telegram; Vercel to pokreće popodne) · instagram = samo Instagram · threads = samo Threads · youtube = samo YouTube · instagram-token = produži Instagram i Threads token · telegram-id = nađi tvoj chat ID za izveštaje'
        type: choice
        options: [normalno, ponovo, provera, notifikacija, drustvene, instagram, threads, youtube, instagram-token, telegram-id]
        default: normalno
      datum:
        description: 'Samo za režime drustvene, instagram, threads i youtube: datum ili više datuma razdvojenih razmakom (2026-10-08 2026-10-09). Prazno = danas.'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: jutarnje-izdanje
  cancel-in-progress: false

jobs:
  izdanje:
    runs-on: ubuntu-latest
    # Pravljenje traje ~15 min, a posao zatim čeka 07:00 za notifikaciju.
    timeout-minutes: 240
    steps:
      - name: Da li je vreme za izdanje
        id: vreme
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sat=$(TZ=Europe/Belgrade date +%-H)
          datum=$(TZ=Europe/Belgrade date +%F)
          pokreni=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "$sat" -lt 5 ]; then
              echo "U Beogradu je $sat h, prerano."
              pokreni=false
            elif gh api "repos/${{ github.repository }}/contents/public/data/$datum.json" --silent 2>/dev/null; then
              echo "Izdanje za $datum već postoji."
              pokreni=false
            fi
          fi
          echo "pokreni=$pokreni" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.vreme.outputs.pokreni == 'true'
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        if: steps.vreme.outputs.pokreni == 'true'
        with:
          node-version: 22

      - name: Claude Code
        if: steps.vreme.outputs.pokreni == 'true'
        run: npm install -g @anthropic-ai/claude-code

      # Glas za YouTube Shorts (Kokoro TTS, besplatan). Treba samo kad se pravi izdanje.
      - uses: actions/setup-python@v5
        if: steps.vreme.outputs.pokreni == 'true' && contains(fromJSON('["normalno","ponovo"]'), inputs.rezim || 'normalno')
        with:
          python-version: '3.12'

      - name: Kokoro TTS
        if: steps.vreme.outputs.pokreni == 'true' && contains(fromJSON('["normalno","ponovo"]'), inputs.rezim || 'normalno')
        run: python -m pip install --quiet kokoro-onnx soundfile

      - name: Kokoro model iz keša
        id: kokoro
        if: steps.vreme.outputs.pokreni == 'true' && contains(fromJSON('["normalno","ponovo"]'), inputs.rezim || 'normalno')
        uses: actions/cache@v4
        with:
          path: scripts/.kokoro
          key: kokoro-v1.0

      - name: Kokoro model
        if: steps.vreme.outputs.pokreni == 'true' && contains(fromJSON('["normalno","ponovo"]'), inputs.rezim || 'normalno') && steps.kokoro.outputs.cache-hit != 'true'
        run: |
          mkdir -p scripts/.kokoro
          curl -sSL -o scripts/.kokoro/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          curl -sSL -o scripts/.kokoro/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin

      - name: Git identitet
        if: steps.vreme.outputs.pokreni == 'true'
        run: |
          git config user.name "Mihajlo"
          git config user.email "zirafica.98@gmail.com"

      - name: Izdanje
        id: izdanje
        if: steps.vreme.outputs.pokreni == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REZIM: ${{ inputs.rezim || 'normalno' }}
          DATUMI: ${{ inputs.datum }}
        run: |
          # Ispis se snima i u fajl, da ga korak „Izveštaj na Telegram“ pročita.
          set -o pipefail
          (
          case "$REZIM" in
            telegram-id) node scripts/izvestaj-telegram.mjs --nadji-chat ;;
            ponovo) bash scripts/jutro.sh --ponovo ;;
            provera) bash scripts/jutro.sh --provera ;;
            notifikacija) npm ci --prefix scripts --no-audit --no-fund --loglevel=error && node scripts/posalji-push.mjs ;;
            drustvene)
              # Svaka mreža posebno: ako jedna ne uspe, ostale se svejedno objavljuju, a posao se na kraju označi kao neuspešan.
              npm ci --prefix scripts --no-audit --no-fund --loglevel=error
              datumi="$DATUMI"
              [ -z "$datumi" ] && datumi="$(TZ=Europe/Belgrade date +%F)"
              greska=0
              for d in $datumi; do
                for mreza in instagram threads youtube telegram; do
                  echo "::group::$mreza $d"
                  # YouTube prvo dopuni jučerašnje Shortove koji nisu stali u dnevnu kvotu (već objavljeni se preskaču).
                  if [ "$mreza" = youtube ] && [ -z "$DATUMI" ]; then
                    node scripts/objavi-youtube.mjs --datum="$(TZ=Europe/Belgrade date -d yesterday +%F)" || greska=1
                  fi
                  node "scripts/objavi-$mreza.mjs" --datum="$d" || greska=1
                  echo "::endgroup::"
                done
              done
              exit $greska
              ;;
            instagram)
              npm ci --prefix scripts --no-audit --no-fund --loglevel=error
              datumi="$DATUMI"
              [ -z "$datumi" ] && datumi="$(TZ=Europe/Belgrade date +%F)"
              prvi=true
              for d in $datumi; do
                # Razmak između objava: app ima limit API poziva po satu, a ni niz postova u istoj minuti ne izgleda dobro.
                $prvi || sleep 300
                prvi=false
                node scripts/objavi-instagram.mjs --datum="$d"
              done
              ;;
            threads)
              npm ci --prefix scripts --no-audit --no-fund --loglevel=error
              datumi="$DATUMI"
              [ -z "$datumi" ] && datumi="$(TZ=Europe/Belgrade date +%F)"
              for d in $datumi; do node scripts/objavi-threads.mjs --datum="$d"; done
              ;;
            youtube)
              npm ci --prefix scripts --no-audit --no-fund --loglevel=error
              datumi="$DATUMI"
              [ -z "$datumi" ] && datumi="$(TZ=Europe/Belgrade date +%F)"
              # Datum može imati i najveći broj videa: 2026-10-25:2 (zbog dnevne kvote).
              for d in $datumi; do
                if [[ "$d" == *:* ]]; then node scripts/objavi-youtube.mjs --datum="${d%%:*}" --najvise="${d#*:}"
                else node scripts/objavi-youtube.mjs --datum="$d"; fi
              done
              ;;
            instagram-token) ;;
            *) bash scripts/jutro.sh ;;
          esac
          ) 2>&1 | tee "$RUNNER_TEMP/izlaz.log"

      # Instagram i Threads token važe 60 dana, pa se produžava 1. i 15. u mesecu (ili ručno, režim instagram-token).
      - name: Instagram token
        if: steps.vreme.outputs.pokreni == 'true' && !cancelled()
        continue-on-error: true
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
          REZIM: ${{ inputs.rezim || 'normalno' }}
        run: |
          dan=$(TZ=Europe/Belgrade date +%-d)
          if [ "$REZIM" = "instagram-token" ] || [ "$dan" = "1" ] || [ "$dan" = "15" ]; then
            node scripts/osvezi-instagram-token.mjs
          else
            echo "Token se produžava 1. i 15. u mesecu, danas je $dan."
          fi

      # Kratak izveštaj tebi na Telegram: šta je urađeno, šta nije i link ka logu.
      - name: Izveštaj na Telegram
        if: always() && steps.vreme.outputs.pokreni == 'true'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          REZIM: ${{ inputs.rezim || 'normalno' }}
          ISHOD: ${{ steps.izdanje.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ "$REZIM" = "telegram-id" ] && exit 0
          node scripts/izvestaj-telegram.mjs "$RUNNER_TEMP/izlaz.log"
