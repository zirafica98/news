# Podsetnik i Dev's pick: mali poslovi odvojeni od „Jutarnjeg izdanja“, da ne čekaju u njegovom redu.
# Pokreće ih Vercel Cron preko api/pokreni-izdanje.mjs:
#   podsetnik  svako jutro: šta Mihajlo danas treba ručno da uradi (scripts/podsetnik.mjs)
#   devs-pick  utorkom posle 16h: kad Dev's pick video izađe na YouTube-u, Instagram reel + story
#              i X objava na Telegram (scripts/devs-pick.mjs)

name: Podsetnik i Dev's pick

on:
  workflow_dispatch:
    inputs:
      rezim:
        description: 'podsetnik = jutarnja lista zadataka na Telegram · devs-pick = objava Dev''s pick videa na Instagram kad izađe na YouTube-u (utorkom)'
        type: choice
        options: [podsetnik, devs-pick]
        default: podsetnik
      datum:
        description: 'Samo za devs-pick: datum objave epizode (YYYY-MM-DD), ako treba ponoviti propuštenu objavu. Prazno = danas.'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: podsetnik-${{ inputs.rezim }}
  cancel-in-progress: false

jobs:
  posao:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Posao
        id: posao
        env:
          REZIM: ${{ inputs.rezim }}
          DATUM: ${{ inputs.datum }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: |
          set -o pipefail
          (
          case "$REZIM" in
            podsetnik) node scripts/podsetnik.mjs ;;
            devs-pick)
              git config user.name "Mihajlo"
              git config user.email "zirafica.98@gmail.com"
              status=0
              node scripts/devs-pick.mjs --objavi ${DATUM:+--datum=$DATUM} || status=$?
              # YouTube link i stanje objave se čuvaju i kad Instagram ne uspe, da se ništa ne objavi dvaput.
              git add public/data/devs-pick.json scripts/state/devs-pick.json 2>/dev/null || true
              git diff --cached --quiet || { git commit -q -m "Dev's pick objavljen $(TZ=Europe/Belgrade date +%F)" && git pull -q --rebase && git push -q; }
              exit $status
              ;;
          esac
          ) 2>&1 | tee "$RUNNER_TEMP/izlaz.log"

      # Javlja se samo kad posao ne uspe (uspešni poslovi sami šalju svoju poruku).
      - name: Izveštaj na Telegram
        if: failure() || cancelled()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          REZIM: ${{ inputs.rezim }}
          ISHOD: ${{ steps.posao.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/izvestaj-telegram.mjs "$RUNNER_TEMP/izlaz.log"
